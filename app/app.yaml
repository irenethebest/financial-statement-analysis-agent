command:
  - streamlit
  - run
  - app.py
  - --server.port=8000
  - --server.address=0.0.0.0

env:
  # Injected from the app's bound resources (names defined in databricks.yml):
  # the bundle's `config:` env block is ignored by current Databricks Apps,
  # so everything must be declared here.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql_warehouse
  - name: LLM_ENDPOINT
    valueFrom: llm
  - name: PIPELINE_JOB_ID
    valueFrom: pipeline
  # APP_CATALOG intentionally NOT set: the app derives its catalog from
  # its own name (fsa-agent-dev -> fs_analysis_agent_dev, etc.), so one
  # app.yaml serves every environment.
